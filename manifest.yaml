# yaml-language-server: $schema=https://instadeep.aichor.ai/schema/latest/manifest.schema.json
kind: AIchorManifest
apiVersion: 0.2.1
builder:
  image: winnow
  dockerfile: ./Dockerfile
  context: .
  buildArgs:
    USE_CUDA: "true"

spec:
  debug:
      vscode:
        enabled: false # required
        path: "/aichor/code" # Optional, defaults to "code". Refer the absolute path of the binary if not findable in $PATH
        provider: "github" # Optional, vscode tunnel provider. Options are "github" or "microsoft", defaults to "github"
  operator: jobset
  image: winnow
  command: bash paper_scripts/run_generalisation_loo_s3.sh

  types:
    worker:
      count: 1
      resources:
        cpus: 6
        ramRatio: 8 # >= 2

        accelerators:
          gpu:
            count: 1
            type: gpu
            product: NVIDIA-H100-80GB-HBM3-MIG-3g.40gb
