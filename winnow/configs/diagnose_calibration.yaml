# --- Calibration diagnostic (tail sTECE / TECE on a labelled holdout) ---
defaults:
  - _self_
  - residues
  - koina
  - data_loader: instanovo

dataset:
  spectrum_path_or_directory: examples/example_data/spectra.mgf
  predictions_path: examples/example_data/predictions.csv

calibrator:
  pretrained_model_name_or_path: InstaDeepAI/winnow-general-model
  cache_dir: null
  # Optional: path to pre-fitted iRT regressors saved during training.
  # When set, loaded regressors are used instead of re-fitting from hold-out data.
  # Leave as null for the general pretrained model workflow (regressors re-fit automatically).
  irt_regressor_path: null
  # Optional RT->iRT regressor fitting overrides (when irt_regressor_path is null):
  # irt_calibration:
  #   train_fraction: 0.3
  #   min_train_points: 10

fdr_control:
  fdr_threshold: 0.05
  confidence_column: calibrated_confidence

diagnostics:
  # Only one of label_source or label_column can be set.
  label_source: sequence
  # Only set when label_source=precomputed (e.g. proteome_hit, correct)
  label_column: null
  # |sTECE| warning threshold (~10% of nominal 5% FDR)
  tolerance: 0.005
  min_tail_psms: 100
  n_bins: 20
  output_dir: results/calibration_diagnostic
  fail_on_warning: false
  plot: true
