name: Publish Python 🐍 distributions 📦 to PyPI


on:
  release:
    types: [published]
  workflow_dispatch:  # allow manual runs

jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/winnow-fdr
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: "pip" # caching pip dependencies

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Read package version
        run: |
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "PKG_VERSION=$PKG_VERSION" >> "$GITHUB_ENV"
          echo "pyproject.toml version: $PKG_VERSION"

      - name: Ensure release tag matches package version
        if: github.event_name == 'release'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"   # tag name, e.g. v0.1.0 -> 0.1.0
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "❌ Release tag $GITHUB_REF_NAME does not match pyproject.toml version $PKG_VERSION. Bump the version before releasing."
            exit 1
          fi

      - name: Ensure version does not already exist on PyPI
        run: |
          echo "Checking if version $PKG_VERSION already exists on PyPI..."
          if curl -sf -o /dev/null "https://pypi.org/pypi/winnow-fdr/$PKG_VERSION/json"; then
            echo "❌ Version $PKG_VERSION already exists on PyPI. Aborting."
            exit 1
          fi

      - name: Build package
        run: python -m build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
