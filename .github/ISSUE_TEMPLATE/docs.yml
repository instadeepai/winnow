name: Documentation
description: Report a proposal or issue related to the documentation (code and/or webpage).
title: "docs: "
labels: ["documentation"]

body:
  - type: textarea
    attributes:
      label: "What and why:"
      description: >
        State which documentation to add or fix and where.
    validations:
      required: true

  - type: textarea
    attributes:
      label: "Notes:"
      description: >
        [OPTIONAL] Only what the above does not cover.
