name: Refactor
description: Make a proposal for refactoring code.
title: "refactor: "
labels: ["refactor"]

body:
  - type: textarea
    attributes:
      label: "What and why:"
      description: >
        State which code changes and why.
    validations:
      required: true

  - type: textarea
    attributes:
      label: "Notes:"
      description: >
        [OPTIONAL] Only what the above does not cover.
