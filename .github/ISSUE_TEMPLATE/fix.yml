name: Bug
description: Report a bug.
title: "fix: "
labels: ["bug"]

body:
  - type: textarea
    attributes:
      label: "Summary:"
      description: >
        State the observed bug.
    validations:
      required: true

  - type: textarea
    attributes:
      label: "Steps to reproduce:"
      description: >
        Minimal commands or code, with versions where relevant.
    validations:
      required: true

  - type: textarea
    attributes:
      label: "Expected vs actual:"
      description: >
        What should happen, and what happens instead (include the error message).
    validations:
      required: true
